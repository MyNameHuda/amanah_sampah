; Pool php-fpm untuk Render free (512 MB RAM total, dibagi dengan nginx + OS).
;
; Semua nilai di sini sengaja kecil. Pool yang agresif (mis. pm=dynamic dengan
; max_children=50) akan membuat php-fpm mencobaallocate lebih dari yang tersedia
; dan di-Render itu berakhir sebagai OOM-kill — service restart sendiri, error
; yang sangat sulit didiagnosis karena tidak ada pesan yang jelas di log.

[www]
user = www-data
group = www-data

; static: jumlah process tetap, tidak naik-turun. Cocok untuk beban kecil
; yang tidak perlu bursting, dan paling hemat RAM.
pm = static
pm.max_children = 6
pm.max_requests = 500

; Nolkan agar tidak ada buffer yang tidak perlu. Buffer response per worker
; bisa jadi puluhan MB kalau request-nya besar (mis. ekspor data).
pm.status_path = /fpm-status

; Slow request (biasanya karena R2/Neon lambat) dilog agar tidak hilang diam-diam.
request_slowlog_timeout = 10s
slowlog = /dev/stderr
request_slowlog_trace_depth = 20

; Jangan tampilkan error ke output — bisa membocorkan path & konfigurasi.catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

;.with ini Laravel tidak bisa menulis cache config/routes saat boot.
clear_env = no
