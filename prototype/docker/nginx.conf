daemon off;
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Render_free punya 512 MB RAM dan CPU 0.1 core. Buffer nginx yang terlalu
    # besar justru memakan RAM tanpa manfaat, jadi diturunkan.
    client_body_buffer_size 128k;
    client_max_body_size 10M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /app/public;
        index index.php index.html;

        charset utf-8;

        # --- Security headers ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Kamera HTTPS WAJIB: BarcodeScanner memakai getUserMedia dan browser
        # hanya mengizinkan kamera pada origin HTTPS.
        add_header Permissions-Policy "camera=(self)" always;

        # --- Asset ber-hash: aman di-cache lama ---
        # Vite memberi hash ke nama file, jadi kalau isi berubah, namanya
        # berubah. Cache 1 tahun aman.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # --- index.html: TIDAK boleh di-cache ---
        # Kalau ter-cache, user pasca-deploy dapat HTML lama yang menunjuk ke
        # asset lama yang sudah dihapus -> white screen.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # --- API ---
        # Rate limit longgar: POS memindai barcode beberapa kali per menit dan
        # scanner bisa menembak beberapa request beruntun. Default Laravel
        # 60/menit terasa sempit untuk pola burst pendek.
        limit_req_zone $binary_remote_addr zone=amanah:10m rate=30r/s;

        location /api/ {
            limit_req zone=amanah burst=20 nodelay;
            add_header Cache-Control "no-store";
            try_files $uri /index.php$is_args$args;
        }

        # --- Health check ---
        location = /up {
            access_log off;
            try_files $uri /index.php$is_args$args;
        }

        # --- Routing SPA ---
        # /login, /super/users, dll adalah route internal React Router dan
        # harus diteruskan ke index.html, bukan 404.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # --- PHP ---
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /app/public;

            # Upload foto 5MB di koneksi lambat butuh waktu lebih dari default.
            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Hanya index.php boleh dieksekusi. Mencegah file .php yang
            # tidak sengaja ter-upload dieksekusi lewat URL.
            try_files $fastcgi_script_name =404;
        }

        # Larang akses ke file tersembunyi (kecuali .well-known untuk ACME).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
