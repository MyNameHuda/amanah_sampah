# =============================================================================
# Nginx site config — Amanah Sampah
# =============================================================================
# Paket ini untuk single-origin: Laravel menyajikan API + hasil build React
# sekaligus dari satu domain. Tidak ada CORS, tidak ada reverse proxy kedua.
#
# Ganti `amanah.example.com` dengan domain milikmu, lalu:
#   sudo ln -s /etc/nginx/sites-available/amanah /etc/nginx/sites-enabled/amanah
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS di-issue otomatis oleh certbot (bagian bawah file ini).
# =============================================================================

# Rate limit zone. Disesuaikan untuk pola POS: staff memindai barcode
# beberapa kali per menit, dan scanner bisa menembak beberapa request
# bersamaan. Default Laravel 60/menit terasa sempit untuk burst pendek.
limit_req_zone $binary_remote_addr zone=amanah_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name amanah.example.com www.amanah.example.com;

    # Certbot menulis challenge ke sini. JANGAN redirect semua ke HTTPS
    # sebelum certbot berhasil — certbot butuh HTTP untuk validasi.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amanah.example.com www.amanah.example.com;

    # certbot --nginx akan mengisi kedua baris ini otomatis.
    #ssl_certificate     /etc/letsencrypt/live/amanah.example.com/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/amanah.example.com/privkey.pem;

    root /var/www/amanah/prototype/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 8M;   # foto bukti max 5MB + margin multipart

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Kamera HTTPS WAJIB: BarcodeScanner memakai getUserMedia, dan browser
    # hanya mengizinkan kamera pada origin HTTPS (kecuali localhost).
    add_header Permissions-Policy "camera=(self)" always;

    # --- Kompresi -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # --- Asset ber-hash: aman di-cache lama --------------------------------
    # Vite memberi hash ke nama file, jadi kalau isi berubah, namanya berubah.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- index.html: TIDAK boleh di-cache ----------------------------------
    # Kalau cache, user pasca-deploy dapat HTML lama yang menunjuk asset lama
    # yang sudah dihapus => white screen. Route Laravel juga sudah set header
    # no-cache, tapi di sini juga dijamin untuk file yang dilayani langsung.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # --- Foto bukti barcode (publik, ada di storage/app/public) -----------
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=amanah_api burst=20 nodelay;

        # Jangan cache respons API sama sekali.
        add_header Cache-Control "no-store";

        try_files $uri /index.php$is_args$args;
    }

    # --- Health check (dipakai UptimeRobot) --------------------------------
    location = /up {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    # --- Routing SPA --------------------------------------------------------
    # /login, /super/users, dll adalah route internal React Router. Nginx
    # harus diteruskan ke index.html, bukan 404.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Eksekusi PHP -------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # sesuaikan versi PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Timeout realistis. Upload foto 5MB di koneksi lambat perlu waktu;
        # default 60s kadang tidak cukup.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Hanya index.php boleh dieksekusi. Ini mencegah file .php yang
        # tidak sengaja ter-upload dieksekusi lewat URL.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;
    }

    # Larang akses ke file sensitif yang tidak perlu web.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/amanah.access.log;
    error_log  /var/log/nginx/amanah.error.log;
}
